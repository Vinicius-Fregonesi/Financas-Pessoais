<div class="flex justify-center">
  <div class="w-full max-w-2xl">
    <p-card styleClass="p-4">
      <!-- Cabeçalho customizado -->
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-semibold text-gray-800 dark:text-gray-100">Editar Finança</h2>
        <div class="flex gap-2">
          <p-button [routerLink]="['../..']" icon="pi pi-list" label="Ver todas" />
          <p-button [routerLink]="['..']" icon="pi pi-arrow-left" label="Voltar" />
          <p-button (onClick)="deleteClicked($event)" icon="pi pi-trash" label="Excluir" />
          <confirm-popup key="delete" confirmSeverity="danger" confirmIcon="pi pi-trash" />
        </div>
      </div>

      <!-- Conteúdo -->
      <api-response [apiResponse]="financas$" errorMessage="Erro ao carregar" loadingMessage="Carregando...">
        <ng-template #success let-financas>
          <form [formGroup]="form" (ngSubmit)="saveClicked()" autocomplete="off">
            <div class="grid grid-cols-1 gap-6">
              <!-- Descrição -->
              <div>
                <label for="descricao" class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">Descrição</label>
                <input pInputText id="descricao" formControlName="descricao" class="w-full" />
              </div>

              <!-- Valor -->
              <div>
                <label for="valor" class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">Valor</label>
                <p-inputNumber id="valor" formControlName="valor" styleClass="w-full" mode="decimal" [minFractionDigits]="2" />
              </div>

              <!-- Data -->
              <div>
                <label for="data" class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">Data</label>
                <p-calendar id="data" formControlName="data" [showTime]="true" [showIcon]="true" class="w-full" />
              </div>

              <!-- Tipo -->
              <div>
                <label for="tipo" class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">Tipo</label>
                <select id="tipo" formControlName="tipo" class="p-inputtext w-full">
                  <option [ngValue]="undefined">Selecione</option>
                  <option *ngFor="let tipo of tiposList" [ngValue]="tipo.value">
                    {{ tipo.name }}
                  </option>
                </select>
              </div>

              <!-- Categoria -->
              <div>
                <label for="categoria" class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">Categoria</label>
                <input pInputText id="categoria" formControlName="categoria" class="w-full" />
              </div>

              <!-- Lista de erros -->
              <error-list [errors]="errors" />

              <!-- Botão Salvar -->
              <p-button type="submit" label="Salvar" icon="pi pi-save" [disabled]="!form.valid" />
            </div>
          </form>
        </ng-template>
      </api-response>
    </p-card>
  </div>
</div>
