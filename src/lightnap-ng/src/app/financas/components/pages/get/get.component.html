<div class="flex justify-center">
  <div class="w-full max-w-4xl mt-3">
    <p-card styleClass="p-4">
      <!-- Cabeçalho customizado -->
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-semibold text-gray-800 dark:text-gray-100">Detalhes da Finança</h2>
        <div class="flex gap-2">
          <p-button [routerLink]="['..']" icon="pi pi-list" label="Ver todas" />
          <p-button [routerLink]="['..', id(), 'edit']" icon="pi pi-pencil" label="Editar" />
        </div>
      </div>

      <api-response [apiResponse]="financas$" errorMessage="Erro ao carregar" loadingMessage="Carregando...">
        <ng-template #success let-financas>
          <!-- Detalhes -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="flex flex-col gap-1">
              <label class="text-sm text-gray-500 dark:text-gray-300">ID</label>
              <div class="text-base font-semibold text-gray-800 dark:text-gray-100">{{ financas.id }}</div>
            </div>

            <div class="flex flex-col gap-1">
              <label class="text-sm text-gray-500 dark:text-gray-300">Descrição</label>
              <div class="text-base font-semibold text-gray-800 dark:text-gray-100">{{ financas.descricao }}</div>
            </div>

            <div class="flex flex-col gap-1">
              <label class="text-sm text-gray-500 dark:text-gray-300">Valor</label>
              <div class="text-base font-semibold text-gray-800 dark:text-gray-100">
                {{ financas.valor | currency:'BRL':'symbol-narrow' }}
              </div>
            </div>

            <div class="flex flex-col gap-1">
              <label class="text-sm text-gray-500 dark:text-gray-300">Data</label>
              <div class="text-base font-semibold text-gray-800 dark:text-gray-100">
                {{ financas.data | date:'dd/MM/yyyy' }}
              </div>
            </div>

            <div class="flex flex-col gap-1">
              <label class="text-sm text-gray-500 dark:text-gray-300">Categoria</label>
              <div class="text-base font-semibold text-gray-800 dark:text-gray-100">{{ financas.categoria || '---' }}</div>
            </div>

            <div class="flex flex-col gap-1">
              <label class="text-sm text-gray-500 dark:text-gray-300">Tipo</label>
              <div class="text-base font-semibold"
                [ngClass]="{
                  'text-green-600 dark:text-green-400': financas.tipo === 'Receita',
                  'text-red-600 dark:text-red-400': financas.tipo === 'Despesa'
                }">
                {{ financas.tipo }}
              </div>
            </div>
          </div>
        </ng-template>

        <ng-template #null>
          <p class="text-red-500 italic">Este item não foi encontrado.</p>
        </ng-template>
      </api-response>
    </p-card>
  </div>
</div>
