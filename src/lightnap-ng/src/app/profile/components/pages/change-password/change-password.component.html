<p-panel header="Mudar senha" styleClass="w-80">
  <form [formGroup]="form" (ngSubmit)="changePassword()" autocomplete="off">
    <div class="flex flex-col gap-4">
      <p-password
        formControlName="currentPassword"
        placeholder="Senha atual"
        styleClass="w-full"
        [toggleMask]="true"
        [feedback]="false"
        inputStyleClass="w-full"
        styleClass="w-full"
      />

      <p-password
        formControlName="newPassword"
        placeholder="Nova Senha"
        styleClass="w-full"
        [toggleMask]="true"
        [feedback]="true"
        inputStyleClass="w-full"
        styleClass="w-full"
      />

      <p-password
        formControlName="confirmNewPassword"
        placeholder="Confirmar Nova Senha"
        styleClass="w-full"
        [toggleMask]="true"
        [feedback]="false"
        inputStyleClass="w-full"
        styleClass="w-full"
      />

      <error-list [errors]="errors" />

      <p-button type="submit" label="Mudar senha" styleClass="w-full" [disabled]="!form.valid" />
    </div>
  </form>
</p-panel>
