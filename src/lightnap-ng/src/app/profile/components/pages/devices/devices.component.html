<api-response [apiResponse]="devices$" errorMessage="Erro ao carregar os dispositivos" loadingMessage="Carregando dispositivos...">
  <ng-template #success let-devices>
    <p-panel header="Gerenciar Dispositivos">
      <p-table [value]="devices">
        <ng-template pTemplate="header">
          <tr>
            <th><i class="pi pi-trash"></i></th>
            <th>Ultima Entrada</th>
            <th>Detalhes</th>
            <th>Endereço IP</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-device>
          <tr>
            <td>
              <confirm-dialog [key]="device.id" />
              <p-button severity="danger" icon="pi pi-trash" title="Remove device" (onClick)="revokeDevice($event, device.id)" />
            </td>
            <td>{{ device.lastSeen | date: "short" }}</td>
            <td>{{ device.details }}</td>
            <td>{{ device.ipAddress }}</td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="100%">Você não tem dispositivos conectados.</td>
          </tr>
        </ng-template>
      </p-table>
      <error-list [errors]="errors" />
    </p-panel>
  </ng-template>
</api-response>
