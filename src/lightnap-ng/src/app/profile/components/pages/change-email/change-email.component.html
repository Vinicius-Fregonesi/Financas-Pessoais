<p-panel header="Mudar Email" class="w-96">
  <form [formGroup]="form" (ngSubmit)="changeEmail()" autocomplete="off">
    <div class="flex flex-col w-80 gap-5">
      <div class="flex flex-col gap-2">
        <label for="newEmail" class="text-xl">Novo Email</label>
        <input id="newEmail" type="text" placeholder="Novo endereço de email" pInputText formControlName="newEmail" />
      </div>

      <error-list [errors]="errors" />

      <p-button type="submit" label="Mudar Email" styleClass="w-full" [disabled]="!form.valid" />
    </div>
  </form>
</p-panel>
