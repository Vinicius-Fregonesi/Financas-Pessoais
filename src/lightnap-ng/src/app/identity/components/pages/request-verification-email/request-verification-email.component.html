<identity-card>
  <span title>Verifique seu email</span>
  <span subtitle>Insira seu email para enviar um link de verificação</span>

  <form [formGroup]="form" (ngSubmit)="resendVerificationEmail()" autocomplete="off">
    <div class="w-96">
      <div class="flex flex-col gap-5">
        <div class="flex flex-col gap-2">
          <label for="email" class="text-xl">Email</label>
          <input id="email" type="text" placeholder="teste@test.com" pInputText formControlName="email" />
        </div>

        <error-list [errors]="errors" />
      </div>
      <p-button type="submit" label="Enviar email de verificação" styleClass="w-full text-xl" [disabled]="!form.valid" pRipple />
      <div class="mt-6">
        <a [routerLink]="'login' | route" class="ml-auto">Voltar ao login</a>
      </div>
    </div>
  </form>
</identity-card>
